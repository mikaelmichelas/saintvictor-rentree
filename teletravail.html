<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suivi télétravail — Mikael Michelas</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#0C447C;--blue-m:#185FA5;--blue-l:#E6F1FB;--blue-b:#B5D4F4;
  --g9:#1a1a1a;--g7:#3d3d3a;--g5:#6b6b68;--g3:#c8c6bc;--g1:#f5f4f0;
  --white:#fff;--red:#a32d2d;--red-bg:#fcebeb;--r:8px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--g1);color:var(--g7);font-size:15px;line-height:1.5;padding:28px 20px 60px;min-height:100vh}
h1{font-size:20px;font-weight:600;color:var(--blue);letter-spacing:-.3px}
.sub{font-size:12px;color:var(--g5);margin-top:2px}
header{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--g3);padding-bottom:16px;margin-bottom:24px;max-width:820px;margin-left:auto;margin-right:auto}
.yr{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--g5)}
select{font-size:13px;padding:5px 10px;border:1px solid var(--g3);border-radius:6px;background:var(--white);color:var(--g7);cursor:pointer}
.main{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sc{background:var(--white);border:1px solid var(--g3);border-radius:var(--r);padding:16px}
.sc.a{background:var(--blue-l);border-color:var(--blue-b)}
.sl{font-size:11px;color:var(--g5);margin-bottom:4px}
.sc.a .sl{color:var(--blue-m)}
.sv{font-size:28px;font-weight:700;color:var(--blue);letter-spacing:-.5px;line-height:1}
.ss{font-size:11px;color:var(--g5);margin-top:4px}
.card{background:var(--white);border:1px solid var(--g3);border-radius:var(--r);padding:20px}
.card h2{font-size:14px;font-weight:600;color:var(--g9);margin-bottom:16px}
.frow{display:grid;grid-template-columns:160px 110px 1fr auto;gap:10px;align-items:end}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;color:var(--g5)}
input[type=date],input[type=number],input[type=text]{font-size:14px;padding:9px 11px;border:1px solid var(--g3);border-radius:6px;background:var(--white);color:var(--g7);width:100%;font-family:inherit}
input:focus{outline:none;border-color:var(--blue-m);box-shadow:0 0 0 3px rgba(24,95,165,.12)}
button{font-size:13px;font-weight:500;padding:9px 16px;border-radius:6px;cursor:pointer;border:1px solid var(--g3);font-family:inherit;transition:background .1s;white-space:nowrap}
.bp{background:var(--blue);color:var(--white);border-color:var(--blue)}
.bp:hover{background:var(--blue-m);border-color:var(--blue-m)}
.bs{background:var(--white);color:var(--g7)}
.bs:hover{background:var(--g1)}
.bd{background:none;border:none;color:var(--red);font-size:12px;padding:3px 7px;cursor:pointer;border-radius:4px}
.bd:hover{background:var(--red-bg)}
.err{font-size:11px;color:var(--red);margin-top:6px;min-height:16px}
.tcard{background:var(--white);border:1px solid var(--g3);border-radius:var(--r);overflow:hidden}
.th2{padding:14px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--g3)}
.th2 h2{font-size:14px;font-weight:600;color:var(--g9)}
.ebtns{display:flex;gap:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;font-size:10px;font-weight:600;color:var(--g5);padding:9px 20px;background:var(--g1);border-bottom:1px solid var(--g3);letter-spacing:.3px}
tbody tr{border-bottom:1px solid var(--g1);transition:background .1s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:#fafaf8}
td{padding:10px 20px;vertical-align:middle}
td.h{font-weight:600;color:var(--blue);font-variant-numeric:tabular-nums}
td.n{color:var(--g5);font-size:12px;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mg td{padding:6px 20px;font-size:10px;font-weight:600;color:var(--g5);background:var(--g1);letter-spacing:.3px;border-top:1px solid var(--g3)}
.empty{padding:44px;text-align:center;color:var(--g5);font-size:13px}
#toast{position:fixed;bottom:24px;right:24px;background:var(--g9);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:999}
#toast.show{opacity:1}
@media(max-width:640px){
  .frow{grid-template-columns:1fr 1fr}
  .frow .field:nth-child(3){grid-column:1/-1}
  .frow button{grid-column:1/-1}
  .stats{grid-template-columns:1fr 1fr}
  header{flex-direction:column;align-items:flex-start;gap:12px}
}
</style>
</head>
<body>

<header>
  <div>
    <h1>Suivi télétravail</h1>
    <p class="sub">Mikael Michelas — Lycée Saint Victor, Valence</p>
  </div>
  <div class="yr">
    <span>Année scolaire</span>
    <select id="ys" onchange="render()"></select>
  </div>
</header>

<div class="main">

  <div class="stats">
    <div class="sc a">
      <div class="sl">Total cette année</div>
      <div class="sv" id="s-total">0h</div>
      <div class="ss" id="s-days">0 jour enregistré</div>
    </div>
    <div class="sc">
      <div class="sl">Ce mois-ci</div>
      <div class="sv" id="s-month">0h</div>
      <div class="ss" id="s-mname">—</div>
    </div>
    <div class="sc">
      <div class="sl">Moyenne mensuelle</div>
      <div class="sv" id="s-avg">0h</div>
      <div class="ss">sur les mois actifs</div>
    </div>
  </div>

  <div class="card">
    <h2>Ajouter une entrée</h2>
    <div class="frow">
      <div class="field">
        <label for="in-date">Date</label>
        <input type="date" id="in-date">
      </div>
      <div class="field">
        <label for="in-h">Heures</label>
        <input type="number" id="in-h" min="0.5" max="12" step="0.5" placeholder="ex. 3.5">
      </div>
      <div class="field">
        <label for="in-n">Note (optionnel)</label>
        <input type="text" id="in-n" placeholder="ex. réunion Parcoursup…">
      </div>
      <button class="bp" onclick="addEntry()">Ajouter</button>
    </div>
    <div class="err" id="err-msg"></div>
  </div>

  <div class="tcard">
    <div class="th2">
      <h2>Historique <span id="cnt" style="color:var(--g5);font-weight:400;font-size:12px"></span></h2>
      <div class="ebtns">
        <button class="bs" onclick="exportCSV()">Export CSV</button>
        <button class="bs" onclick="exportPDF()">Export PDF</button>
      </div>
    </div>
    <table>
      <thead><tr><th>Date</th><th>Heures</th><th>Note</th><th></th></tr></thead>
      <tbody id="tb"></tbody>
    </table>
  </div>

</div>

<div id="toast"></div>

<script>
const MFR=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const DFR=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
const KEY='teletravail_sv_v1';

function loadDB(){try{return JSON.parse(localStorage.getItem(KEY))||{};}catch(e){return {};}}
function saveDB(db){localStorage.setItem(KEY,JSON.stringify(db));}

function sy(date){const d=new Date(date+'T12:00:00');const m=d.getMonth();const y=d.getFullYear();return m>=8?`${y}-${y+1}`:`${y-1}-${y}`;}
function curY(){return sy(new Date().toISOString().slice(0,10));}
function selY(){return document.getElementById('ys').value;}
function fmtH(h){const i=Math.floor(h);const m=Math.round((h-i)*60);return m>0?`${i}h${m.toString().padStart(2,'0')}`:`${i}h`;}
function fmtDate(s){const d=new Date(s+'T12:00:00');return `${DFR[d.getDay()]} ${d.getDate()} ${MFR[d.getMonth()]} ${d.getFullYear()}`;}
function mkey(s){const d=new Date(s+'T12:00:00');return `${MFR[d.getMonth()]} ${d.getFullYear()}`;}

function buildYears(){
  const db=loadDB();
  const years=new Set(Object.keys(db));years.add(curY());
  const sorted=[...years].sort().reverse();
  const sel=document.getElementById('ys');
  const cur=sel.value||curY();
  sel.innerHTML=sorted.map(y=>`<option value="${y}">${y.split('-')[0]}-${y.split('-')[1].slice(2)}</option>`).join('');
  sel.value=sorted.includes(cur)?cur:sorted[0];
}

function render(){
  const db=loadDB();
  const year=selY();
  const entries=(db[year]||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));
  const total=entries.reduce((s,e)=>s+e.hours,0);

  document.getElementById('s-total').textContent=fmtH(total);
  document.getElementById('s-days').textContent=`${entries.length} jour${entries.length>1?'s':''} enregistré${entries.length>1?'s':''}`;
  document.getElementById('cnt').textContent=entries.length?`(${entries.length})`:'';

  const now=new Date();const cm=now.getMonth();const cy=now.getFullYear();
  const me=entries.filter(e=>{const d=new Date(e.date+'T12:00:00');return d.getMonth()===cm&&d.getFullYear()===cy;});
  document.getElementById('s-month').textContent=fmtH(me.reduce((s,e)=>s+e.hours,0));
  document.getElementById('s-mname').textContent=`${MFR[cm]} ${cy}`;

  if(entries.length>0){
    const byM={};entries.forEach(e=>{const k=mkey(e.date);byM[k]=(byM[k]||0)+e.hours;});
    document.getElementById('s-avg').textContent=fmtH(total/Object.keys(byM).length);
  }else{document.getElementById('s-avg').textContent='0h';}

  const tb=document.getElementById('tb');
  if(!entries.length){tb.innerHTML='<tr><td colspan="4" class="empty">Aucune entrée pour cette année scolaire.</td></tr>';return;}

  let html='';let lm=null;
  entries.forEach(e=>{
    const m=mkey(e.date);
    if(m!==lm){
      const mt=entries.filter(x=>mkey(x.date)===m).reduce((s,x)=>s+x.hours,0);
      html+=`<tr class="mg"><td colspan="4">${m} — ${fmtH(mt)}</td></tr>`;
      lm=m;
    }
    const noteEsc=(e.note||'').replace(/"/g,'&quot;').replace(/</g,'&lt;');
    html+=`<tr>
      <td>${fmtDate(e.date)}</td>
      <td class="h">${fmtH(e.hours)}</td>
      <td class="n" title="${noteEsc}">${e.note||'<span style="color:var(--g3)">—</span>'}</td>
      <td style="width:40px;text-align:right"><button class="bd" onclick="delEntry('${year}','${e.id}')">✕</button></td>
    </tr>`;
  });
  tb.innerHTML=html;
}

function addEntry(){
  const date=document.getElementById('in-date').value;
  const hv=document.getElementById('in-h').value;
  const note=document.getElementById('in-n').value.trim();
  const err=document.getElementById('err-msg');
  err.textContent='';

  if(!date){err.textContent='Choisir une date.';return;}
  const hours=parseFloat(hv);
  if(!hv||isNaN(hours)||hours<=0){err.textContent="Saisir un nombre d'heures valide.";return;}

  const db=loadDB();
  const year=sy(date);
  if(!db[year])db[year]=[];
  if(db[year].find(e=>e.date===date)){err.textContent='Une entrée existe déjà pour ce jour.';return;}

  db[year].push({id:Date.now().toString(),date,hours,note});
  saveDB(db);
  document.getElementById('in-h').value='';
  document.getElementById('in-n').value='';
  buildYears();
  document.getElementById('ys').value=year;
  render();
  toast(`${fmtH(hours)} ajoutées — ${fmtDate(date)}`);
}

function delEntry(year,id){
  const db=loadDB();
  db[year]=(db[year]||[]).filter(e=>e.id!==id);
  saveDB(db);render();toast('Entrée supprimée.');
}

function exportCSV(){
  const db=loadDB();const year=selY();
  const entries=(db[year]||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
  if(!entries.length){toast('Aucune donnée à exporter.');return;}
  let csv='Date;Heures;Note\n';
  entries.forEach(e=>{csv+=`${e.date};${fmtH(e.hours)};"${(e.note||'').replace(/"/g,'""')}"\n`;});
  csv+=`\nTotal;;${fmtH(entries.reduce((s,e)=>s+e.hours,0))}`;
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`teletravail_${year}.csv`;a.click();URL.revokeObjectURL(a.href);
  toast('CSV téléchargé.');
}

function exportPDF(){
  const db=loadDB();const year=selY();
  const entries=(db[year]||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
  if(!entries.length){toast('Aucune donnée à exporter.');return;}
  const total=entries.reduce((s,e)=>s+e.hours,0);
  const byM={};
  entries.forEach(e=>{const k=mkey(e.date);if(!byM[k])byM[k]=[];byM[k].push(e);});
  let rows='';
  Object.entries(byM).forEach(([m,mes])=>{
    const mt=mes.reduce((s,e)=>s+e.hours,0);
    rows+=`<tr class="mg"><td colspan="3">${m} — <strong>${fmtH(mt)}</strong></td></tr>`;
    mes.forEach(e=>{rows+=`<tr><td>${fmtDate(e.date)}</td><td class="h">${fmtH(e.hours)}</td><td class="n">${(e.note||'').replace(/</g,'&lt;')}</td></tr>`;});
  });
  const today=new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});
  const [y1,y2]=year.split('-');
  const w=window.open('','_blank');
  w.document.write(`<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><title>Teletravail ${y1}-${y2.slice(2)}</title><style>
body{font-family:Arial,sans-serif;font-size:12px;color:#222;padding:32px 40px}
h1{font-size:17px;color:#0C447C;margin-bottom:4px}
.sub{font-size:11px;color:#666;margin-bottom:22px}
.stats{display:flex;gap:40px;margin-bottom:22px;padding:14px 18px;background:#E6F1FB;border-radius:6px}
.sl{font-size:10px;color:#185FA5;margin-bottom:2px}.sv{font-size:22px;font-weight:700;color:#0C447C}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10px;color:#888;padding:7px 12px;border-bottom:1px solid #ddd;background:#f5f4f0;letter-spacing:.3px}
td{padding:7px 12px;border-bottom:1px solid #f0eeea;vertical-align:top}
td.h{font-weight:600;color:#0C447C;width:70px}td.n{color:#666}
tr.mg td{background:#f5f4f0;font-weight:600;font-size:11px;color:#333;padding:8px 12px;border-top:1px solid #ccc;border-bottom:1px solid #ccc}
.footer{margin-top:32px;font-size:10px;color:#aaa;border-top:1px solid #eee;padding-top:10px}
@media print{body{padding:16px}}
</style></head><body>
<h1>Releve de teletravail ${y1}-${y2.slice(2)}</h1>
<p class="sub">Mikael Michelas · Lycee Saint Victor, Valence · Edite le ${today}</p>
<div class="stats">
  <div><div class="sl">Total annuel</div><div class="sv">${fmtH(total)}</div></div>
  <div><div class="sl">Jours enregistres</div><div class="sv">${entries.length}</div></div>
  <div><div class="sl">Annee scolaire</div><div class="sv">${y1}-${y2.slice(2)}</div></div>
</div>
<table><thead><tr><th>Date</th><th>Heures</th><th>Note</th></tr></thead><tbody>${rows}</tbody></table>
<div class="footer">Lycee Saint Victor · Valence · Document genere automatiquement</div>
</body></html>`);
  w.document.close();
  setTimeout(()=>w.print(),500);
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}

document.getElementById('in-date').value=new Date().toISOString().slice(0,10);
document.getElementById('in-h').addEventListener('keydown',e=>{if(e.key==='Enter')addEntry();});
document.getElementById('in-n').addEventListener('keydown',e=>{if(e.key==='Enter')addEntry();});
buildYears();render();
</script>
</body>
</html>
